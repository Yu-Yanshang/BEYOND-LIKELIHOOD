### model
# LoRA 预测时不能直接把 adapter 输出目录当完整模型加载；
# 需要指定 base model，并通过 adapter_name_or_path 挂载 LoRA 权重。
model_name_or_path: ./Qwen3-0.6B
adapter_name_or_path: ./dpo/outputs/qwen3_06b_code_lora_dpo
trust_remote_code: true

### method
stage: sft
do_predict: true
finetuning_type: lora

### dataset
dataset_dir: ./dpo/data
eval_dataset: code_dpo_test
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: ./dpo/outputs/predict_qwen3_06b_lora_dpo_on_code_dpo
overwrite_output_dir: true
report_to: none

### generation
per_device_eval_batch_size: 2
predict_with_generate: true
max_new_tokens: 768
do_sample: false
num_beams: 1
fp16: true
ddp_timeout: 180000000
