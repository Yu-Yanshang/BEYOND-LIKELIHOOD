### model
model_name_or_path: ./dpo/outputs/a2full_dpo_lora_ppo_20260706/full_dpo
adapter_name_or_path: ./dpo/outputs/a2full_dpo_lora_ppo_20260706/lora_dpo
trust_remote_code: true
ref_model: ./dpo/outputs/a2full_dpo_lora_ppo_20260706/full_dpo
reward_model: http://127.0.0.1:18080
reward_model_type: api

### method
stage: ppo
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
cutoff_len: 512
ppo_buffer_size: 1
ppo_epochs: 1

### dataset
dataset_dir: ./dpo/data
dataset: code_ppo_train
template: qwen3
enable_thinking: false
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: ./dpo/outputs/a2full_dpo_lora_ppo_20260706/ppo_reward_fn
logging_steps: 5
save_steps: 1442
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
gradient_checkpointing: true
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null

### generation
max_new_tokens: 128
do_sample: true
top_p: 0.9
temperature: 0.7
