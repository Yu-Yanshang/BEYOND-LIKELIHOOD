### model
model_name_or_path: /root/project/best_path/runs/best_full_dpo_a5_20260702/models/a2_full
trust_remote_code: true
ref_model: /root/project/best_path/runs/best_full_dpo_a5_20260702/models/a2_full
reward_model: http://127.0.0.1:18080
reward_model_type: api

### method
stage: ppo
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
cutoff_len: 1024
ppo_buffer_size: 2
ppo_epochs: 1
ppo_target: 1.5
ppo_score_norm: true
ppo_whiten_rewards: true

### dataset
dataset_dir: ./dpo/data
dataset: a2full_reward_ppo_train
template: qwen3
enable_thinking: false
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: ./dpo/outputs/a2full_best_ppo_reward/ppo_adapter
logging_steps: 5
save_steps: 50
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 5.0e-7
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.08
max_grad_norm: 0.5
gradient_checkpointing: true
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null

### generation
max_new_tokens: 192
do_sample: true
top_p: 0.85
temperature: 0.6
