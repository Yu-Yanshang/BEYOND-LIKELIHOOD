### model
model_name_or_path: ./Qwen3-0.6B
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
pref_beta: 0.1
pref_loss: sigmoid
ref_model: ./Qwen3-0.6B

### LoRA
# Qwen3-0.6B 常用线性层：注意力投影 + MLP 投影。
# 如果显存仍然紧张，可以先改成 q_proj,v_proj。
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj

### dataset
dataset_dir: ./dpo/data
dataset: code_dpo_train
template: qwen3_nothink
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: ./dpo/outputs/qwen3_06b_code_lora_dpo
logging_steps: 5
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
# LoRA 训练保存的是 adapter，不是完整模型。
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
gradient_checkpointing: true
fp16: true
bf16: false
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_strategy: "no"
